<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#150f0c">
<!-- Über „Zum Home-Bildschirm" startet das Quiz im Vollbild und behält seinen Speicher -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Üben">
<!-- Symbol für den Home-Bildschirm; iOS rundet die Ecken selbst -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Sprachen Üben ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Zauberschule: Pergament, Tinte, Gold, Kerzenschein */
    --pergament:      #f2e3c2;
    --pergament-hell: #faf1da;
    --pergament-dunkel: #e2cfa4;
    --tinte:       #2a1c10;
    --tinte-blass: #6b563c;
    --gold:        #c9a227;
    --gold-hell:   #e9cf7a;
    --dunkel:      #150f0c;
    --dunkel-warm: #241a13;
    --correct: #2f7d4f;
    --wrong:   #a32b2b;
    --bg: var(--dunkel);
    --text: var(--tinte);
    --muted: var(--tinte-blass);
    --radius: 10px;
    --c: #7b1f2b;
    --cl: #f0d9d2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: var(--dunkel);
    color: var(--pergament);
    min-height: 100vh;
    min-height: 100dvh;
    /* Kerzenschein aus zwei Ecken, dazu ein warmer Schimmer in der Mitte */
    background-image: radial-gradient(circle at 15% 8%,  rgba(201,162,39,0.22) 0%, transparent 42%),
                      radial-gradient(circle at 88% 92%, rgba(180,90,40,0.18) 0%, transparent 45%),
                      radial-gradient(circle at 50% 45%, rgba(90,60,30,0.35) 0%, transparent 65%);
    background-attachment: fixed;
    /* iOS: nichts unter der Home-Leiste verstecken */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             calc(env(safe-area-inset-bottom) + 30px) env(safe-area-inset-left);
  }

  /* Keine Tipp-Verzögerung, kein Doppeltipp-Zoom, kein graues Blitzen,
     kein Text-Markieren beim Langdruck (iOS) */
  button {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    font-family: inherit;
    cursor: pointer;
    color: var(--text);
  }

  .wrap { max-width: 480px; margin: 0 auto; padding: 0 14px; }

  /* ── KOPFZEILE ───────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0 10px;
  }
  /* iPhone mit Notch/Dynamic Island: iOS verwischt unter der Statusleiste einen
     Streifen, der etwas weiter reicht als der Sicherheitsabstand. Die Kopfzeile
     rückt deshalb nur dort ein Stück tiefer. min(…, 1px) * 28 ergibt 28px, wenn
     es einen Abstand gibt, sonst 0 – Computer und ältere Handys bleiben gleich. */
  @supports (padding-top: env(safe-area-inset-top)) {
    header { padding-top: calc(12px + min(env(safe-area-inset-top), 1px) * 28); }
  }

  .back-btn {
    width: 40px; height: 40px;
    flex-shrink: 0;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    background: var(--dunkel-warm);
    color: var(--gold-hell);
    box-shadow: 0 0 12px rgba(201,162,39,0.25);
    font-size: 1.25rem;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .back-btn:active { transform: scale(0.92); }
  body.quiz .back-btn, body.konto .back-btn { display: flex; }

  header h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #e9cf7a, #c9a227 55%, #8c6b14);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 18px rgba(201,162,39,0.25);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── STARTMENÜ ───────────────────────────── */
  body.quiz #menu, body.konto #menu, body.konto #quiz { display: none; }
  body:not(.quiz) #quiz { display: none; }
  body:not(.konto) #konto { display: none; }

  #quiz { animation: reinRechts 0.25s ease; }
  @keyframes reinRechts {
    from { opacity: 0; transform: translateX(14px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Weiter üben: zweitrangig neben «Heute fällig», darum schlank */
  .resume {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    border: 1px solid rgba(201,162,39,0.45);
    border-radius: var(--radius);
    padding: 9px 14px;
    margin-bottom: 18px;
    color: var(--gold-hell);
    background: rgba(36,26,19,0.75);
  }
  .resume:active { transform: scale(0.985); }
  .resume .emoji { font-size: 1.15rem; }
  .resume .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .resume .t b {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--gold-hell);
  }
  .resume .t span { font-size: 0.84rem; font-weight: 500; color: #b9a37a; }
  .resume .t span::before { content: ' · '; }
  .resume .go { font-size: 1.05rem; color: var(--gold); }

  /* ── WOCHENZIEL: im Menü an der Stelle des Titels, links neben den Flaggen ── */
  body:not(.quiz):not(.konto) header h1 { display: none; }
  body.quiz .woche, body.konto .woche { display: none; }
  .woche {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: 8px;
    padding-left: 2px;
    font-size: 0.86rem;
    line-height: 1.3;
    color: #b9a37a;
  }
  .woche .w-rauten { font-size: 0.8rem; letter-spacing: 3px; color: var(--gold); }
  .woche .w-txt { white-space: nowrap; }
  .woche b { color: var(--gold-hell); font-weight: 600; }
  /* «heute noch 4 Fragen» als zweite, leisere Zeile */
  .woche .w-heute { flex-basis: 100%; font-size: 0.8rem; font-style: italic; }

  /* ── SPRACHWAHL: zwei Flaggen rechts in der Kopfzeile ── */
  .sprachwahl { display: flex; gap: 6px; flex-shrink: 0; }
  .sprachwahl:empty, body.quiz .sprachwahl, body.konto .sprachwahl { display: none; }
  .sprachwahl button {
    width: 40px; height: 40px;
    display: grid;
    place-items: center;
    border: 1.5px solid transparent;
    border-radius: 50%;
    background: none;
    font-size: 1.3rem;
    line-height: 1;
    opacity: 0.45;
    filter: saturate(0.5);
  }
  .sprachwahl button.aktiv {
    opacity: 1;
    filter: none;
    border-color: var(--gold);
    background: var(--dunkel-warm);
    box-shadow: 0 0 12px rgba(201,162,39,0.3);
  }
  .sprachwahl button:active { transform: scale(0.92); }
  .sprachwahl button:focus-visible { outline: 2px solid var(--gold-hell); outline-offset: 2px; }

  /* ── HEUTE FÄLLIG: das eine goldene Stück im Menü ── */
  .heute {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    border: 1px solid #f3dc9a;
    border-radius: var(--radius);
    padding: 13px 16px;
    margin-bottom: 10px;
    color: #2a1c0c;
    background:
      radial-gradient(ellipse at 18% 0%, rgba(255,246,214,0.75) 0%, transparent 55%),
      linear-gradient(160deg, #e6c668 0%, #c9a227 60%, #9d7a16 100%);
    box-shadow: inset 0 0 0 1px rgba(110,80,10,0.35), 0 4px 18px rgba(0,0,0,0.5), 0 0 24px rgba(201,162,39,0.22);
  }
  .heute:active { transform: scale(0.985); }
  .heute .emoji { font-size: 1.7rem; }
  .heute .t { flex: 1; min-width: 0; }
  .heute .t b {
    display: block;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.25;
  }
  .heute .t span { font-size: 0.88rem; font-weight: 600; color: #4a3410; }
  .heute .go { font-size: 1.2rem; }
  /* Erledigt: tritt zurück, braucht keinen Platz mehr */
  .heute.erledigt {
    padding: 8px 14px;
    color: #b9a37a;
    background: none;
    border: 1px dashed rgba(201,162,39,0.35);
    box-shadow: none;
  }
  .heute.erledigt .emoji { font-size: 1.15rem; }
  .heute.erledigt .t b { display: inline; font-size: 0.82rem; color: var(--gold-hell); }
  .heute.erledigt .t span { font-size: 0.84rem; font-weight: 500; font-style: italic; color: #b9a37a; }
  .heute.erledigt .t span::before { content: ' · '; font-style: normal; }
  .heute.erledigt:active { transform: none; }

  /* Zugeklappte Gruppen rücken zusammen, offene behalten Luft */
  .group { margin-bottom: 14px; }
  .group.closed { margin-bottom: 0; }

  .group-head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 44px;
    background: none;
    border: none;
    padding: 8px 4px;
    text-align: left;
  }
  .group-head .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .group-head .title {
    flex: 1;
    min-width: 0;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .group-head .chev { font-size: 0.7rem; color: #9c7f4e; transition: transform 0.2s ease; }

  /* Sterne pro Unité in der Kopfzeile; antippen zeigt die Etappen */
  .sterne {
    display: inline-flex;
    gap: 1px;
    padding: 4px 6px;
    margin: -4px 0;
    border-radius: 12px;
    font-size: 0.95rem;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
  }
  .sterne i { font-style: normal; color: #6e5a37; }
  .sterne i.voll { color: var(--gold); text-shadow: 0 0 6px rgba(201,162,39,0.45); }
  .sterne.krone { font-size: 1.15rem; }
  .sterne:focus-visible { outline: 2px solid var(--gold-hell); outline-offset: 1px; }
  .etappen[hidden] { display: none; }
  .etappen {
    margin: 0 0 10px;
    padding: 10px 12px;
    border: 1px solid rgba(201,162,39,0.3);
    border-radius: var(--radius);
    background: rgba(36,26,19,0.75);
    font-size: 0.86rem;
    line-height: 1.35;
    color: #b9a37a;
  }
  .etappe { display: flex; gap: 8px; padding: 3px 0; }
  .etappe .e-stern { width: 1.2em; flex-shrink: 0; text-align: center; color: #6e5a37; }
  .etappe.ok .e-stern { color: var(--gold); }
  .etappe b { color: var(--gold-hell); font-weight: 600; }
  .etappe em { display: block; font-size: 0.8rem; color: #8f7a55; }
  .etappe.krone-zeile { margin-top: 4px; padding-top: 7px; border-top: 1px solid rgba(201,162,39,0.2); }
  .etappe.krone-zeile:not(.ok) { opacity: 0.6; }

  .result-screen p.stern-zeile { color: var(--gold-hell); }
  .result-screen p.krone-zeile { font-size: 1.1rem; color: var(--gold); }
  .krone-toast .krone-gross { font-size: 2.6rem; line-height: 1.2; }
  .group.closed .chev { transform: rotate(-90deg); }
  .group.closed .deck-list { display: none; }

  .deck-list { display: flex; flex-direction: column; gap: 8px; }

  /* Deck-Karte = Pergamentstreifen mit Wachssiegel */
  .deck {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 64px;
    text-align: left;
    color: var(--tinte);
    background:
      linear-gradient(115deg, rgba(255,255,255,0.35) 0%, transparent 35%),
      radial-gradient(ellipse at 80% 120%, rgba(120,80,30,0.14) 0%, transparent 60%),
      var(--pergament);
    border: 1px solid var(--pergament-dunkel);
    border-left: 5px solid var(--dc, #7b1f2b);
    border-radius: 4px;
    padding: 12px 14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.45);
  }
  .deck:active { transform: scale(0.985); box-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  @media (hover: hover) {
    .deck:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.55), 0 0 0 1px var(--gold); }
  }
  .deck.leer { opacity: 0.42; }
  .deck.leer:active { transform: none; }

  .deck .icon {
    width: 38px; height: 38px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--dc, #7b1f2b);
    border: 2px solid var(--gold);
    box-shadow: inset 0 1px 3px rgba(255,255,255,0.25), 0 1px 3px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
  }
  .deck .txt { flex: 1; min-width: 0; }
  .deck .txt b {
    display: block;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.3;
    color: var(--tinte);
  }
  .deck .txt span { font-size: 0.8rem; font-weight: 500; font-style: italic; color: var(--tinte-blass); }
  .deck .ring {
    flex-shrink: 0;
    width: 34px; height: 34px;
    display: grid;
    place-items: center;
    font-size: 0.62rem;
    font-weight: 700;
    color: #7a5c1e;
    border-radius: 50%;
    /* Lernstand: Gold = sitzt (--p), hell = unterwegs (bis --q). Ohne Lernstand ist --q = --p. */
    background: conic-gradient(
      #b8901c calc(var(--p, 0) * 1%),
      rgba(184,144,28,0.4) 0 calc(var(--q, 0) * 1%),
      rgba(120,90,40,0.18) 0);
    position: relative;
  }
  .deck .ring.zahl { font-size: 0.78rem; }
  .deck .ring::before {
    content: '';
    position: absolute;
    inset: 4px;
    background: var(--pergament);
    border-radius: 50%;
  }
  .deck .ring i { position: relative; font-style: normal; }

  .hinweis {
    margin-top: 22px;
    text-align: center;
    font-size: 0.76rem;
    font-style: italic;
    color: #7a6748;
  }

  /* ── SPIELER-LEISTE ──────────────────────── */
  .player-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .level-badge {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--gold-hell);
    white-space: nowrap;
  }
  .xp-bar-wrap {
    flex: 1;
    background: rgba(120,90,40,0.25);
    border: 1px solid rgba(201,162,39,0.35);
    border-radius: 50px;
    height: 8px;
    overflow: hidden;
    min-width: 50px;
  }
  .xp-bar-fill {
    height: 100%;
    border-radius: 50px;
    background: linear-gradient(90deg, #8c6b14, #e9cf7a);
    box-shadow: 0 0 8px rgba(233,207,122,0.6);
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .xp-label { font-size: 0.72rem; font-weight: 600; color: #9c7f4e; white-space: nowrap; }

  /* ── MODUS-LEISTE ────────────────────────── */
  .mode-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .modes {
    display: flex;
    border-radius: 50px;
    border: 1.5px solid rgba(201,162,39,0.45);
    background: rgba(36,26,19,0.8);
    overflow: hidden;
  }
  .mode-btn {
    min-height: 38px;
    padding: 6px 12px;
    border: none;
    background: transparent;
    font-size: 0.8rem;
    font-weight: 600;
    color: #b9a37a;
    white-space: nowrap;
  }
  .mode-btn.active {
    background: linear-gradient(180deg, #e9cf7a, #c9a227);
    color: #2a1c10;
    font-weight: 700;
    border-radius: 50px;
  }

  .toggle-wrap { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .toggle-wrap input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: rgba(120,90,40,0.45);
    border: 1px solid rgba(201,162,39,0.35);
    border-radius: 50px;
    transition: background 0.25s;
    cursor: pointer;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    left: 3px; top: 3px;
    background: var(--pergament-hell);
    border-radius: 50%;
    transition: transform 0.25s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .toggle-wrap input:checked + .toggle-slider { background: linear-gradient(180deg, #e9cf7a, #c9a227); }
  .toggle-wrap input:checked + .toggle-slider::before { transform: translateX(20px); }
  .autoread-icon { font-size: 0.95rem; }

  /* ── FORTSCHRITT ─────────────────────────── */
  .progress-bar-wrap {
    background: rgba(120,90,40,0.25);
    border: 1px solid rgba(201,162,39,0.3);
    border-radius: 50px;
    height: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 50px;
    transition: width 0.4s ease;
    background: linear-gradient(90deg, #8c6b14, #e9cf7a);
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.84rem;
    color: #9c7f4e;
    font-weight: 600;
    margin-bottom: 18px;
  }

  /* ── KARTE ───────────────────────────────── */
  /* Quiz-Karte = aufgeschlagenes Pergament */
  .card {
    color: var(--tinte);
    background:
      linear-gradient(125deg, rgba(255,255,255,0.4) 0%, transparent 30%),
      radial-gradient(ellipse at 15% 100%, rgba(120,80,30,0.13) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 0%, rgba(120,80,30,0.1) 0%, transparent 50%),
      var(--pergament);
    border: 1px solid var(--pergament-dunkel);
    border-top: 4px solid var(--c);
    border-radius: var(--radius);
    padding: 30px 22px 26px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.55), inset 0 0 40px rgba(180,140,80,0.15);
    animation: slideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-label {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #8a6d3f;
    margin-bottom: 10px;
  }

  .card-word-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .card-word {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1.85rem;
    font-weight: 700;
    line-height: 1.25;
    color: var(--tinte);
  }

  .speak-btn {
    background: rgba(255,255,255,0.35);
    border: 1.5px solid var(--pergament-dunkel);
    border-radius: 50%;
    width: 40px; height: 40px;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
    color: var(--tinte-blass);
  }
  .speak-btn:active { border-color: var(--c); background: var(--cl); color: var(--c); }
  .speak-btn.speaking {
    border-color: var(--c);
    background: var(--cl);
    color: var(--c);
    animation: speakPulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes speakPulse {
    from { transform: scale(1); }
    to   { transform: scale(1.15); }
  }

  /* ── ANTWORTEN ───────────────────────────── */
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .ans-btn {
    min-height: 54px;
    padding: 13px 10px;
    border-radius: 6px;
    border: 1.5px solid var(--pergament-dunkel);
    background: linear-gradient(180deg, var(--pergament-hell), #f0e0be);
    color: var(--tinte);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 1.05rem;
    font-weight: 600;
    transition: all 0.15s ease;
    line-height: 1.3;
    box-shadow: 0 1px 2px rgba(90,60,20,0.18);
  }
  .ans-btn:active:not(:disabled) { border-color: var(--gold); background: var(--cl); }
  @media (hover: hover) {
    .ans-btn:hover:not(:disabled) { border-color: var(--gold); background: var(--cl); }
  }
  .ans-btn.correct {
    background: #d8e8cf;
    border-color: var(--correct);
    color: #1e5233;
    box-shadow: 0 0 12px rgba(47,125,79,0.35);
  }
  .ans-btn.wrong {
    background: #eed6d1;
    border-color: var(--wrong);
    color: #7d1f1f;
  }
  .ans-btn:disabled { cursor: default; }

  /* ── RECHTSCHREIBUNG: Buchstaben ordnen ──── */
  .ordnen { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .luecken {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 16px;          /* Abstand zwischen Wörtern */
  }
  .l-wort { display: flex; gap: 3px; align-items: flex-end; }
  .luecke {
    width: 26px; height: 36px;
    padding: 0;
    border: none;
    border-bottom: 2px solid var(--tinte-blass);
    background: rgba(255,255,255,0.35);
    border-radius: 4px 4px 0 0;
    color: var(--tinte);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1;
  }
  .luecke.voll { background: var(--pergament-hell); }
  .luecke.gut { border-bottom-color: var(--correct); color: #1e5233; }
  .luecke.schlecht { border-bottom-color: var(--wrong); color: #7d1f1f; background: #eed6d1; }
  .fest { font-size: 1.35rem; font-weight: 700; color: var(--tinte-blass); padding: 0 1px 4px; }
  .steine { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .stein {
    width: 42px; height: 46px;
    border: 1.5px solid var(--pergament-dunkel);
    border-radius: 8px;
    background: linear-gradient(180deg, var(--pergament-hell), #f0e0be);
    color: var(--tinte);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 1.35rem;
    font-weight: 700;
    box-shadow: 0 2px 0 #c9b48a;
  }
  .stein:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
  .stein:disabled { opacity: 0.2; box-shadow: none; }
  .stein.weg { display: none; }
  /* Wortweise: das Wort, an dem sie gerade ist */
  .l-wort.aktiv .luecke { border-bottom-color: var(--gold); background: rgba(201,162,39,0.18); }
  /* Ausgewählte Lücke: hier landet der nächste Stein */
  .luecke.cursor {
    border-bottom: 3px solid #a8831c;
    background: rgba(201,162,39,0.38);
    box-shadow: inset 0 0 0 1.5px #c9a227;
  }
  .zurueck-btn {
    min-width: 64px; min-height: 40px;
    border: 1px solid var(--pergament-dunkel);
    border-radius: 20px;
    background: transparent;
    color: var(--tinte-blass);
    font-size: 1.1rem;
  }
  .zurueck-btn:disabled { opacity: 0.3; }

  /* ── RECHTSCHREIBUNG: selbst schreiben ───── */
  .schreiben { display: flex; flex-direction: column; gap: 12px; }
  .schreiben input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--pergament-dunkel);
    border-radius: 8px;
    background: var(--pergament-hell);
    color: var(--tinte);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 1.3rem;      /* ab 16px zoomt iOS beim Antippen nicht hinein */
    font-weight: 600;
    text-align: center;
  }
  .schreiben input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,39,0.25); }
  .schreiben input.gut { border-color: var(--correct); background: #d8e8cf; }
  .schreiben input.fast { border-color: #c27c2c; background: #f3e2c7; }
  .schreiben input.schlecht { border-color: var(--wrong); background: #eed6d1; }
  .akzente { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .akzent {
    min-width: 38px; height: 40px;
    border: 1px solid var(--pergament-dunkel);
    border-radius: 6px;
    background: var(--pergament-hell);
    color: var(--tinte);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 1.2rem;
    font-weight: 600;
  }
  .akzent:disabled { opacity: 0.35; }
  .pruefen-btn {
    min-height: 48px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(180deg, #e9cf7a, #c9a227);
    color: #2a1c10;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1rem;
    font-weight: 700;
  }
  .pruefen-btn:disabled { opacity: 0.4; }
  .loesung:empty { display: none; }
  .loesung { text-align: center; }
  .loesung span { display: block; font-size: 0.82rem; font-style: italic; color: var(--tinte-blass); }
  .loesung b { font-size: 1.35rem; letter-spacing: 0.02em; color: #1e5233; }
  .loesung mark { background: #f6d58a; color: #7d1f1f; border-radius: 2px; padding: 0 1px; }
  .feedback.fast { color: #a0601d; }

  /* ── RÜCKMELDUNG ─────────────────────────── */
  .feedback {
    margin-top: 18px;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1.15rem;
    font-weight: 700;
    min-height: 34px;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  .feedback.correct { color: #2f7d4f; }
  /* Stufe des Wortes nach der Antwort */
  .stufe { min-height: 1.3em; margin-top: 2px; text-align: center; font-size: 0.82rem; font-weight: 600; color: var(--tinte-blass); }
  .stufe .rauten { letter-spacing: 3px; color: #a8831c; }
  .stufe.sitzt { color: #2f7d4f; }
  .result-screen p.aufstieg { margin-bottom: 8px; font-style: normal; font-weight: 600; color: var(--gold-hell); }
  .feedback.wrong   { color: #a32b2b; }

  .next-btn-wrap { display: flex; justify-content: center; margin: 14px auto 0; }
  .next-btn {
    position: relative;
    min-height: 46px;
    padding: 11px 28px;
    border-radius: 50px;
    border: 1.5px solid var(--gold);
    background: linear-gradient(180deg, #3a2418, #241a13);
    color: var(--gold-hell);
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.9rem;
    font-weight: 700;
    box-shadow: 0 3px 12px rgba(0,0,0,0.4), 0 0 14px rgba(201,162,39,0.2);
    overflow: hidden;
  }
  .next-btn:active { transform: translateY(1px); }
  .next-btn.hidden { display: none; }
  .next-btn .countdown-fill {
    position: absolute;
    top: 0; right: 0;
    height: 100%; width: 100%;
    background: rgba(201,162,39,0.3);
    transform-origin: right center;
    border-radius: 50px;
  }
  .next-btn.counting .countdown-fill {
    animation: drainLeft var(--countdown-dur, 2s) linear forwards;
  }
  @keyframes drainLeft {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }
  .next-btn span { position: relative; z-index: 1; }

  /* ── ERGEBNIS ────────────────────────────── */
  .result-screen { text-align: center; padding: 30px 10px; position: relative; animation: slideIn 0.4s ease; }
  .result-screen h2 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--gold-hell);
    margin-bottom: 10px;
    animation: fadeSlideUp 0.5s ease 0.2s both;
  }
  .result-score {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 2.6rem;
    font-weight: 900;
    color: var(--gold);
    margin: 8px 0 18px;
    text-shadow: 0 0 20px rgba(201,162,39,0.35);
    animation: fadeSlideUp 0.5s ease 0.35s both;
  }
  .result-screen p { color: #b9a37a; font-size: 1rem; font-style: italic; margin-bottom: 22px; }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .stars {
    font-size: 1.5rem;
    margin-bottom: 6px;
    letter-spacing: 6px;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(201,162,39,0.6);
  }

  .result-btns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .restart-btn {
    min-height: 52px;
    padding: 14px 38px;
    border-radius: 50px;
    border: 1.5px solid var(--gold);
    background: linear-gradient(180deg, #e9cf7a, #c9a227);
    color: #2a1c10;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.98rem;
    font-weight: 700;
    box-shadow: 0 4px 22px rgba(201,162,39,0.35);
  }
  .restart-btn:active { transform: translateY(1px); }
  .menu-btn {
    min-height: 44px;
    padding: 10px 26px;
    border-radius: 50px;
    border: 1.5px solid rgba(201,162,39,0.4);
    background: transparent;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: #b9a37a;
  }

  /* ── ANIMATIONEN ERGEBNIS ────────────────── */
  #anim-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 999;
  }

  /* Zauberstab mit leuchtender Spitze (ab 70%) */
  .stab-wrap { position: relative; width: 150px; height: 120px; margin: 0 auto 14px; }
  .stab {
    position: absolute;
    left: 14px; bottom: 26px;
    width: 100px; height: 9px;
    border-radius: 5px;
    background: linear-gradient(90deg, #2f1d12, #6b4a2a 55%, #8a6a3a);
    transform: rotate(-30deg);
    transform-origin: left bottom;
    box-shadow: 0 3px 8px rgba(0,0,0,0.55);
  }
  .stab-licht {
    position: absolute;
    left: 88px; top: 14px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle, #fffbe8 0%, #e9cf7a 40%, rgba(233,207,122,0.35) 62%, transparent 72%);
    animation: stabPuls 1.7s ease-in-out infinite;
  }
  @keyframes stabPuls {
    0%, 100% { transform: scale(1);    opacity: 0.85; }
    50%      { transform: scale(1.35); opacity: 1; }
  }
  .funke {
    position: absolute;
    left: 102px; top: 28px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #f3dc9b;
    box-shadow: 0 0 8px #e9cf7a;
    animation: funkeFliegt 1.9s ease-out infinite;
  }
  @keyframes funkeFliegt {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }

  /* Brennende Kerze (ab 40%) */
  .kerze-wrap { width: 120px; height: 118px; margin: 0 auto 14px; position: relative; }
  .kerze-koerper {
    position: absolute;
    left: 50%; bottom: 6px;
    transform: translateX(-50%);
    width: 26px; height: 58px;
    border-radius: 4px 4px 3px 3px;
    background: linear-gradient(90deg, #d9c69c, #f7eed6 42%, #dccaa2);
    box-shadow: 0 3px 10px rgba(0,0,0,0.5);
  }
  .kerze-docht {
    position: absolute;
    left: 50%; bottom: 64px;
    transform: translateX(-50%);
    width: 2px; height: 9px;
    background: #2f1d12;
  }
  .kerze-flamme {
    position: absolute;
    left: 50%; bottom: 71px;
    width: 17px; height: 28px;
    border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
    background: radial-gradient(circle at 50% 72%, #fffbe8 0%, #ffe9a8 22%, #f5b53c 48%, rgba(240,120,20,0.55) 76%, transparent 88%);
    box-shadow: 0 0 30px rgba(245,181,60,0.55);
    animation: flackern 1.15s ease-in-out infinite;
  }
  @keyframes flackern {
    0%, 100% { transform: translateX(-50%) scale(1) rotate(-1.5deg); }
    50%      { transform: translateX(-50%) scale(1.07, 1.13) rotate(1.5deg); }
  }

  /* Nebelschwaden (unter 40%) */
  .nebel-wrap { position: relative; height: 96px; margin-bottom: 10px; overflow: hidden; }
  .nebel {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(198,206,214,0.45), rgba(160,170,180,0.15) 55%, transparent 72%);
    filter: blur(7px);
    animation: ziehen linear infinite;
  }
  @keyframes ziehen {
    0%   { transform: translateX(-130px); opacity: 0; }
    25%  { opacity: 0.9; }
    75%  { opacity: 0.9; }
    100% { transform: translateX(130px); opacity: 0; }
  }
  .kessel { display: block; margin: 0 auto; animation: kesselWackelt 3s ease-in-out infinite; }
  @keyframes kesselWackelt {
    0%, 100% { transform: rotate(-1.5deg); }
    50%      { transform: rotate(1.5deg); }
  }

  /* ── KONTO ───────────────────────────────── */
  /* Profil-Icon in der Kopfzeile: Anfangsbuchstabe des Kindes */
  #konto-icon { flex-shrink: 0; }
  #konto-icon:empty, body.quiz #konto-icon, body.konto #konto-icon { display: none; }
  .konto-icon {
    position: relative;
    width: 40px; height: 40px;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
    background: var(--pergament);
    color: var(--tinte);
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1;
    box-shadow: 0 1px 6px rgba(0,0,0,0.45);
  }
  .konto-icon:active { transform: scale(0.92); }
  .konto-icon:focus-visible { outline: 2px solid var(--gold-hell); outline-offset: 2px; }
  /* Noch kein Profil gewählt: zurückhaltend */
  .konto-icon.ohne { background: var(--dunkel-warm); color: var(--gold-hell); border-style: dashed; }
  .konto-icon.emoji { font-size: 1.05rem; }
  .konto-icon.laedt { opacity: 0.7; }
  /* Offline oder abgemeldet: kleiner oranger Punkt */
  .konto-icon.warnung::after {
    content: '';
    position: absolute;
    top: -1px; right: -1px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #e08a2c;
    border: 2px solid var(--dunkel);
  }

  #konto { animation: reinRechts 0.25s ease; }
  .konto-karte {
    display: flex;
    flex-direction: column;
    gap: 12px;
    color: var(--tinte);
    background:
      linear-gradient(125deg, rgba(255,255,255,0.4) 0%, transparent 30%),
      var(--pergament);
    border: 1px solid var(--pergament-dunkel);
    border-top: 4px solid var(--gold);
    border-radius: var(--radius);
    padding: 22px 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.55);
  }
  .konto-karte h2 { font-family: 'Cinzel', Georgia, serif; font-size: 1.1rem; text-align: center; }
  .konto-karte p { font-size: 0.95rem; line-height: 1.4; }
  .konto-karte label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 600; color: var(--tinte-blass); }
  .konto-karte input[type=email], .konto-karte input[type=password], .konto-karte input[type=text] {
    font: inherit;
    font-size: 1rem;
    color: var(--tinte);
    padding: 10px 12px;
    border: 1px solid #b89d68;
    border-radius: 8px;
    background: var(--pergament-hell);
  }
  .konto-karte label.haken { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; }
  .konto-karte .restart-btn, .konto-karte .menu-btn { width: 100%; }
  .konto-karte .menu-btn { color: var(--tinte); border-color: #b89d68; }
  .konto-meldung { padding: 8px 10px; border-radius: 6px; background: rgba(47,125,79,0.15); color: #1f5a37; }
  .konto-meldung.fehler { background: rgba(163,43,43,0.12); color: var(--wrong); }
  .link-btn {
    background: none;
    border: none;
    color: #b9a37a;
    font-size: 0.85rem;
    text-decoration: underline;
    padding: 10px 4px;
    min-height: 40px;
  }
  .konto-karte .link-btn { color: var(--tinte-blass); }
  #konto > .link-btn { display: block; margin: 14px auto 0; }
  .profil-liste { display: flex; flex-direction: column; gap: 8px; }
  .profil-zeile { display: flex; gap: 8px; }
  .profil {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    padding: 10px 14px;
    text-align: left;
    background: var(--pergament-hell);
    border: 1px solid var(--pergament-dunkel);
    border-left: 5px solid var(--gold);
    border-radius: 6px;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1rem;
  }
  .profil.aktiv { box-shadow: 0 0 0 2px var(--gold); }
  .profil .emoji { font-size: 1.4rem; }
  .profil-weg { width: 48px; border: 1px solid var(--wrong); border-radius: 6px; background: transparent; color: var(--wrong); font-size: 1.1rem; }
  .profil-neu { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid var(--pergament-dunkel); }
  .konto-fuss { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 12px; margin-top: 12px; font-size: 0.85rem; color: #b9a37a; }

  /* ── XP-POPUP & LEVEL-UP ─────────────────── */
  .xp-popup {
    position: fixed;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--gold-hell);
    text-shadow: 0 0 10px rgba(201,162,39,0.7);
    pointer-events: none;
    z-index: 1001;
    transform: translateX(-50%);
    animation: xpFloat 1.1s ease forwards;
  }
  @keyframes xpFloat {
    0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-55px); }
  }

  .level-up-toast {
    position: fixed;
    top: 50%; left: 50%;
    background: linear-gradient(160deg, #3a2418, #241a13);
    border: 2px solid var(--gold);
    color: var(--gold-hell);
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1.15rem;
    font-weight: 700;
    padding: 20px 34px;
    border-radius: 12px;
    text-align: center;
    line-height: 1.6;
    box-shadow: 0 8px 50px rgba(201,162,39,0.4), inset 0 0 40px rgba(201,162,39,0.1);
    z-index: 1002;
    pointer-events: none;
    animation: levelUpPop 2.6s ease forwards;
  }
  @keyframes levelUpPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    12%  { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    20%  { transform: translate(-50%, -50%) scale(1); }
    75%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
  }
</style>
</head>
<body>

<canvas id="anim-canvas"></canvas>

<div class="wrap">
  <header>
    <button class="back-btn" onclick="zumMenu()" aria-label="Zurück zum Menü">←</button>
    <h1 id="kopf">✦ Sprachen Üben ✦</h1>
    <div class="woche" id="woche"></div>
    <div id="konto-icon"></div>
    <div class="sprachwahl" id="sprachwahl"></div>
  </header>

  <!-- ══ STARTMENÜ ══ -->
  <div id="menu">
    <button class="heute" id="heute-btn" style="display:none"></button>
    <button class="resume" id="resume-btn" style="display:none"></button>
    <div id="gruppen"></div>
    <div class="hinweis" id="hinweis"></div>
  </div>

  <!-- ══ QUIZ ══ -->
  <div id="quiz">
    <div class="player-bar">
      <span class="level-badge" id="level-badge">🪄 1. Rang</span>
      <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xp-bar-fill" style="width:0%"></div></div>
      <span class="xp-label" id="xp-label">0 / 50 XP</span>
    </div>

    <div class="mode-bar">
      <div class="modes" id="modi"></div>
      <label class="toggle-wrap" title="Automatisch vorlesen">
        <input type="checkbox" id="autoread-toggle" onchange="setzeVorlesen(this.checked)">
        <span class="toggle-slider"></span>
      </label>
      <span class="autoread-icon">🔊</span>
    </div>

    <div id="quiz-area"></div>
  </div>

  <!-- ══ KONTO (nur wenn in config.js eingerichtet) ══ -->
  <div id="konto"></div>
</div>

<script src="config.js"></script>
<script src="konto.js"></script>
<script src="vokabeln.js"></script>
<script>
// ════════════════════════════════════════════════════════════
//  SPEICHER
//  Alles unter einem Schlüssel. localStorage kann gesperrt sein
//  (Privatmodus, file://) → darf nie zum Absturz führen.
// ════════════════════════════════════════════════════════════
const SPEICHER = 'franz_quiz_v1';
const MAX_FEHLER = 80;

// Mit Konto hat jedes Kinderprofil seinen eigenen Speicher (konto.js)
function speicherSchluessel() {
  return (window.Konto && Konto.schluessel()) || SPEICHER;
}

function leereDaten() {
  return { version: 1, xp: { fr: 0, en: 0 }, decks: {}, fehler: [],
           letztes: null, laufend: null, vorlesen: true,
           // Lernstand pro Wort: woerter[deckId][schluessel] = { s: Stufe 0–5, f: fällig ab Tag, t: Tag des letzten Fehlers }
           woerter: {},
           // Wie viele neue Wörter die Runde «Heute fällig» am Tag schon gebracht hat
           tagesNeu: { tag: 0 },   // { tag, fr: n, en: n }
           // Gewählte Sprache im Menü – alle Inhalte und Zähler richten sich danach
           sprache: null,
           // Zuletzt geübte Liste pro Sprache, für «Weiter üben»
           letzteJe: {},
           // Beantwortete Fragen pro Tag (alle Sprachen zusammen), fürs Wochenziel
           tage: {},
           // Was mit einem Wort schon einmal richtig war: erfolge[deckId][schluessel] = Bits (siehe ERFOLG)
           erfolge: {},
           // Verdiente Etappen pro Unité: sterne[gruppenId] = ['entdeckt', …] – einmal verdient, bleibt verdient
           sterne: {} };
}

function ladeDaten() {
  let d = leereDaten();
  try {
    const roh = localStorage.getItem(speicherSchluessel());
    if (roh) {
      const gespeichert = JSON.parse(roh);
      d = Object.assign(d, gespeichert);
      d.xp = Object.assign({ fr: 0, en: 0 }, gespeichert.xp);
    } else if (speicherSchluessel() === SPEICHER) {
      // Umzug vom alten Format: die bisherigen XP zählten alle für Französisch
      const alt = parseInt(localStorage.getItem('quiz_xp') || '0');
      if (alt > 0) d.xp.fr = alt;
    }
  } catch (e) {}
  return d;
}

function speichere() {
  // Zeitstempel entscheidet beim Abgleich zwischen Geräten, welcher Stand neuer ist
  daten.geaendert = Date.now();
  try { localStorage.setItem(speicherSchluessel(), JSON.stringify(daten)); } catch (e) {}
  if (window.Konto) Konto.geaendert();
}

const daten = ladeDaten();

// Ersetzt den ganzen Stand, z.B. beim Profilwechsel oder wenn ein
// anderes Gerät neuer ist. Der Zeitstempel bleibt dabei unverändert.
function uebernehmeDaten(neu) {
  const d = Object.assign(leereDaten(), neu || {});
  d.xp = Object.assign({ fr: 0, en: 0 }, (neu || {}).xp);
  Object.keys(daten).forEach(k => delete daten[k]);
  Object.assign(daten, d);
  vorlesen = daten.vorlesen !== false;
  try { localStorage.setItem(speicherSchluessel(), JSON.stringify(daten)); } catch (e) {}
  if (!document.body.classList.contains('quiz') && !document.body.classList.contains('konto')) zeigeMenu();
}

// ════════════════════════════════════════════════════════════
//  DECKS AUFBEREITEN
// ════════════════════════════════════════════════════════════
const alleDecks = {};
QUIZ_DATEN.gruppen.forEach(g => {
  g.decks.forEach(d => {
    d.gruppe = g;
    d.sprache = g.sprache;
    d.farbe = g.farbe;
    d.hell = g.hell;
    alleDecks[d.id] = d;
  });
});

// ── Sprachen: ergeben sich aus den Gruppen in vokabeln.js ──
const SPRACHEN = [...new Set(QUIZ_DATEN.gruppen.map(g => g.sprache).filter(Boolean))];
const SPRACH_NAME = { fr: 'Französisch', en: 'Englisch' };
const SPRACH_FLAGGE = { fr: '🇫🇷', en: '🇬🇧' };

// Die im Menü gewählte Sprache. Ohne Wahl: die der zuletzt geübten Liste.
function aktiveSprache() {
  if (SPRACHEN.includes(daten.sprache)) return daten.sprache;
  const letztes = daten.letztes && alleDecks[daten.letztes.deckId];
  return (letztes && SPRACHEN.includes(letztes.sprache)) ? letztes.sprache : SPRACHEN[0];
}

function setzeSprache(sp) {
  if (!SPRACHEN.includes(sp)) return;
  daten.sprache = sp;
  speichere();
  zeigeMenu();
}

// «Heute fällig» ist kein Deck aus vokabeln.js: es sammelt die Wörter
// aller Listen einer Sprache. Pro Sprache gibt es eine eigene Runde.
const HEUTE = {};
SPRACHEN.forEach(sp => {
  HEUTE[sp] = { id: '__heute-' + sp, icon: '🔮', titel: 'Heute fällig', typ: 'heute',
                sprache: sp, farbe: '#6b4a17', hell: '#eee0c4', woerter: [] };
  alleDecks[HEUTE[sp].id] = HEUTE[sp];
});

function standardModus(deck) {
  return { vokabeln: 'f-d', artikel: 'artikel', konjugation: 'konj', zahlen: 'num-f',
           fehler: 'gemischt', heute: 'gemischt' }[deck.typ];
}

function modiVon(deck) {
  const f = deck.sprache === 'en' ? '🇬🇧' : '🇫🇷';
  switch (deck.typ) {
    case 'vokabeln': {
      const modi = [{ id: 'f-d', label: `${f}→🇩🇪` }, { id: 'd-f', label: `🇩🇪→${f}` }];
      // Listen mit fettgedruckten Wörtern: Rechtschreibung üben
      if (deck.woerter.some(w => w.schreiben)) {
        modi.push({ id: 'ordnen', label: '🧩 Ordnen' }, { id: 'schreiben', label: '✍️ Schreiben' });
      }
      return modi;
    }
    case 'artikel':     return [{ id: 'artikel', label: 'un / une / des' }];
    case 'konjugation': return [{ id: 'konj', label: 'Formen' }];
    case 'zahlen':      return [{ id: 'num-f', label: '🔢→🇫🇷' }, { id: 'f-num', label: '🇫🇷→🔢' }];
    default:            return [{ id: 'gemischt', label: 'Gemischt' }];
  }
}

function anzahlWoerter(deck) {
  if (deck.typ === 'heute') return heuteEintraege(deck.sprache).length;
  return deck.typ === 'fehler' ? fehlerEintraege().length : deck.woerter.length;
}

// Stabiler Schlüssel eines Eintrags – für die Fehlerliste
function schluessel(eintrag) {
  return eintrag.num !== undefined ? String(eintrag.num) : eintrag.fr;
}

// ════════════════════════════════════════════════════════════
//  LERNSTAND PRO WORT
//  Jedes Wort hat eine Stufe 0–5. Richtig (wenn fällig) = eine
//  Stufe hoch und längere Pause, falsch = eine Stufe zurück und
//  heute nochmals. Ab Stufe 4 «sitzt» ein Wort.
//  Zahlen haben keinen Lernstand: 1000 Einträge, die einer Regel
//  folgen, sind kein Wortschatz.
// ════════════════════════════════════════════════════════════
const PAUSE_TAGE = [0, 1, 3, 7, 14, 30];   // Pause nach Erreichen der Stufe
const STUFE_SITZT = 4;
const MAX_STUFE = 5;
const NEU_PRO_TAG = 10;                    // neue Wörter pro Tag in «Heute fällig»
const MIT_LERNSTAND = ['vokabeln', 'artikel', 'konjugation'];
// Ab dieser Stufe steigt ein Wort nur noch, wenn es Deutsch→Fremdsprache
// gewusst wurde. Fremdsprache→Deutsch hält es dann auf seiner Stufe.
const STUFE_NUR_ABRUFEN = 2;
// Fettgedruckte Wörter (schreiben: true) brauchen danach mehr:
// Stufe 2→3 Buchstaben ordnen, ab Stufe 3 selbst schreiben.
const RANG = { erkennen: 0, abrufen: 1, ordnen: 2, schreiben: 3 };
function noetigerRang(k, stufe) {
  if (stufe < STUFE_NUR_ABRUFEN) return 0;
  if (!k.schreiben) return RANG.abrufen;
  return stufe === STUFE_NUR_ABRUFEN ? RANG.ordnen : RANG.schreiben;
}
const RANG_HINWEIS = { 1: '🇩🇪→{f}', 2: '🧩 Ordnen', 3: '✍️ Schreiben' };

// Fortlaufende Tagesnummer nach Ortszeit – ein Tag beginnt um Mitternacht
function heuteTag() {
  const d = new Date();
  return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
}

function hatLernstand(deck) {
  return !!deck && MIT_LERNSTAND.includes(deck.typ);
}

function standVon(deckId, k) {
  return (daten.woerter[deckId] || {})[k] || null;
}

// Neue Wörter, die «Heute fällig» heute in dieser Sprache schon gebracht hat
function neuHeute(sprache) {
  const t = daten.tagesNeu;
  return t && t.tag === heuteTag() ? (t[sprache] || 0) : 0;
}

// Trägt eine Antwort ein. Gibt { vorher, nachher, neu } zurück,
// oder null für Karten ohne Lernstand.
function lerne(k, richtig) {
  if (!hatLernstand(alleDecks[k.deckId])) return null;
  const heute = heuteTag();
  const deckStand = daten.woerter[k.deckId] || (daten.woerter[k.deckId] = {});
  const alt = deckStand[k.schluessel];
  const w = alt || { s: 0, f: heute };
  const vorher = w.s;
  // Karten aus älteren, angefangenen Runden haben noch keine Richtung: wie bisher behandeln
  const rang = k.richtung in RANG ? RANG[k.richtung] : Infinity;
  const noetig = noetigerRang(k, w.s);
  const nurErkannt = rang < noetig;
  let gebremst = 0;

  if (richtig === 'akzent') {
    // Nur Akzente falsch: weder Auf- noch Abstieg, das Wort bleibt fällig
    deckStand[k.schluessel] = w;
    return { vorher, nachher: w.s, neu: !alt, gebremst: 0, akzent: true };
  }

  if (!richtig) {
    w.s = Math.max(0, w.s - 1);
    w.f = heute;          // kommt heute nochmals
    w.t = heute;
  } else if (w.f <= heute) {
    if (nurErkannt) {
      // Nur erkannt: zählt nicht als Fortschritt. Das Wort bleibt fällig
      // und kommt in «Heute fällig» in der Richtung Deutsch→Fremdsprache.
      gebremst = noetig;
    } else if (w.t === heute) {
      // Heute schon einmal falsch: gilt als geübt, steigt aber erst morgen wieder
      w.f = heute + 1;
    } else {
      w.s = Math.min(MAX_STUFE, w.s + 1);
      w.f = heute + PAUSE_TAGE[w.s];
    }
  }
  // Richtig, aber noch nicht fällig: nichts ändert sich. So lässt sich
  // eine Liste nicht an einem Abend «fertig» tippen.

  deckStand[k.schluessel] = w;
  if (!alt && aktuell.deck && aktuell.deck.typ === 'heute') {
    const sp = aktuell.deck.sprache;
    const t = daten.tagesNeu && daten.tagesNeu.tag === heute ? daten.tagesNeu : { tag: heute };
    t[sp] = (t[sp] || 0) + 1;
    daten.tagesNeu = t;
  }
  return { vorher, nachher: w.s, neu: !alt, gebremst };
}

// Zählt für ein Deck: wie viele Wörter sitzen, wie viele sind unterwegs
function lernstandVon(deck) {
  const stand = daten.woerter[deck.id] || {};
  let sitzen = 0, unterwegs = 0;
  deck.woerter.forEach(w => {
    const e = stand[schluessel(w)];
    if (!e) return;
    if (e.s >= STUFE_SITZT) sitzen++; else unterwegs++;
  });
  return { sitzen, unterwegs, gesamt: deck.woerter.length };
}

// Fällige Wörter einer Sprache bis und mit Tag `bis` → [{ deck, eintrag, stand }]
function faelligeEintraege(bis, sprache) {
  const raus = [];
  Object.keys(daten.woerter).forEach(deckId => {
    const deck = alleDecks[deckId];
    if (!hatLernstand(deck) || deck.sprache !== sprache) return;
    const stand = daten.woerter[deckId];
    deck.woerter.forEach(w => {
      const e = stand[schluessel(w)];
      if (e && e.f <= bis) raus.push({ deck, eintrag: w, stand: e });
    });
  });
  return raus;
}

// Neue Wörter kommen nur aus Listen, die schon einmal geübt wurden –
// zuletzt geübte zuerst, also der aktuelle Schulstoff vor dem alten.
function neueEintraege(max, sprache) {
  if (max <= 0) return [];
  const decks = Object.values(alleDecks)
    .filter(d => hatLernstand(d) && d.sprache === sprache && daten.decks[d.id])
    .sort((a, b) => (daten.decks[b.id].zuletzt || 0) - (daten.decks[a.id].zuletzt || 0));
  const raus = [];
  for (const deck of decks) {
    const stand = daten.woerter[deck.id] || {};
    for (const w of mische(deck.woerter)) {
      if (stand[schluessel(w)]) continue;
      raus.push({ deck, eintrag: w, stand: null });
      if (raus.length >= max) return raus;
    }
  }
  return raus;
}

// Die Runde «Heute fällig»: zuerst Fälliges (am längsten Wartendes voran),
// dann mit neuen Wörtern auffüllen
function heuteEintraege(sprache) {
  const faellig = faelligeEintraege(heuteTag(), sprache)
    .sort((a, b) => a.stand.f - b.stand.f || a.stand.s - b.stand.s)
    .slice(0, LIMIT);
  const platz = Math.min(LIMIT - faellig.length, NEU_PRO_TAG - neuHeute(sprache));
  return faellig.concat(neueEintraege(platz, sprache));
}

// ════════════════════════════════════════════════════════════
//  WOCHENZIEL
//  Drei Übungstage pro Woche genügen – egal in welcher Sprache.
//  Ein Tag zählt, sobald TAG_ZIEL Fragen beantwortet sind.
// ════════════════════════════════════════════════════════════
const WOCHEN_ZIEL = 3;
const TAG_ZIEL = 10;

// Montag = Tag 0 der Woche
function wocheStand() {
  const heute = heuteTag();
  const start = heute - ((new Date().getDay() + 6) % 7);
  let tage = 0;
  for (let t = start; t < start + 7; t++) {
    if ((daten.tage[t] || 0) >= TAG_ZIEL) tage++;
  }
  return { tage, heuteAntworten: daten.tage[heute] || 0 };
}

// Zählt eine beantwortete Frage. Gibt true zurück, wenn der Tag
// genau damit zum Übungstag geworden ist.
function zaehleAntwort() {
  const heute = heuteTag();
  const n = (daten.tage[heute] || 0) + 1;
  daten.tage[heute] = n;
  // Alte Tage wegräumen, damit der gespeicherte Stand klein bleibt
  Object.keys(daten.tage).forEach(t => { if (Number(t) < heute - 60) delete daten.tage[t]; });
  return n === TAG_ZIEL;
}

function rauten(voll, von) {
  return '◆'.repeat(Math.min(voll, von)) + '◇'.repeat(Math.max(0, von - voll));
}

// Je besser ein Wort sitzt, desto schwieriger die Richtung:
// zuerst erkennen (🇫🇷→🇩🇪), ab Stufe 2 selbst wissen (🇩🇪→🇫🇷)
// Je besser ein Wort sitzt, desto anspruchsvoller die Abfrage.
// Fettgedruckte Wörter: ab Stufe 2 Buchstaben ordnen, ab Stufe 3 schreiben.
function heuteModus(deck, stand, eintrag) {
  if (deck.typ !== 'vokabeln') return standardModus(deck);
  const s = stand ? stand.s : 0;
  if (s < STUFE_NUR_ABRUFEN) return 'f-d';
  if (eintrag && eintrag.schreiben) return s === STUFE_NUR_ABRUFEN ? 'ordnen' : 'schreiben';
  return 'd-f';
}

// ════════════════════════════════════════════════════════════
//  STERNE PRO UNITÉ
//  Fünf Etappen, je ein Stern; alle geschafft = Krone. Gezählt wird
//  jede richtige Antwort, egal wo (Liste, Heute fällig, Fehler) –
//  anders als beim Lernstand ohne Wartezeit. Unités ohne fett
//  gedruckte Wörter haben nur die ersten drei Etappen.
// ════════════════════════════════════════════════════════════
const ERFOLG = { erkennen: 1, abrufen: 2, ordnen: 4, schreiben: 8 };
const ETAPPEN = [
  { id: 'entdeckt',    name: 'Entdeckt',    was: 'jede Liste einmal fertig gespielt' },
  { id: 'erkannt',     name: 'Erkannt',     was: 'jedes Wort einmal richtig {f}→🇩🇪', bit: 1 },
  { id: 'gewusst',     name: 'Gewusst',     was: 'jedes Wort einmal richtig 🇩🇪→{f}', bit: 2 },
  { id: 'gelegt',      name: 'Gelegt',      was: 'jedes fette Wort einmal richtig geordnet', bit: 4, fett: true },
  { id: 'geschrieben', name: 'Geschrieben', was: 'jedes fette Wort einmal richtig geschrieben', bit: 8, fett: true },
];

function gruppenId(g) { return g.id || g.titel; }

// Unités mit Wortlisten bekommen Sterne (nicht «Übergreifend», nicht «Wiederholen»)
function hatSterne(g) {
  return !!g.sprache && g.decks.some(d => d.typ === 'vokabeln');
}

// Stand aller Etappen einer Unité → [{ ...etappe, fehlt, verdient }]
function etappenVon(g) {
  const vok = g.decks.filter(d => d.typ === 'vokabeln');
  const alle = vok.flatMap(d => d.woerter.map(w => ({ d, w })));
  const fett = alle.filter(x => x.w.schreiben);
  const bits = x => ((daten.erfolge[x.d.id] || {})[schluessel(x.w)]) || 0;
  const verdient = new Set(daten.sterne[gruppenId(g)] || []);
  return ETAPPEN.filter(e => !e.fett || fett.length).map(e => {
    let fehlt;
    if (e.id === 'entdeckt') fehlt = g.decks.filter(d => !(daten.decks[d.id] && daten.decks[d.id].geuebt)).map(d => d.titel);
    else fehlt = (e.fett ? fett : alle).filter(x => !(bits(x) & e.bit));
    return Object.assign({}, e, { fehlt, verdient: verdient.has(e.id) || fehlt.length === 0 });
  });
}

// Neu geschaffte Etappen speichern; gibt sie zurück [{ g, etappe, krone }]
function aktualisiereSterne() {
  const neu = [];
  QUIZ_DATEN.gruppen.filter(hatSterne).forEach(g => {
    const id = gruppenId(g);
    const vorher = new Set(daten.sterne[id] || []);
    const etappen = etappenVon(g);
    const jetzt = etappen.filter(e => e.verdient).map(e => e.id);
    const dazu = jetzt.filter(e => !vorher.has(e));
    if (!dazu.length) return;
    daten.sterne[id] = [...new Set([...vorher, ...jetzt])];
    const krone = etappen.every(e => e.verdient);
    dazu.forEach(e => neu.push({ g, etappe: ETAPPEN.find(x => x.id === e), krone }));
  });
  return neu;
}

// Richtige Antwort vermerken (nur Wortlisten)
function merkeErfolg(k) {
  const bit = ERFOLG[k.richtung];
  const deck = alleDecks[k.deckId];
  if (!bit || !deck || deck.typ !== 'vokabeln') return;
  const e = daten.erfolge[k.deckId] || (daten.erfolge[k.deckId] = {});
  e[k.schluessel] = (e[k.schluessel] || 0) | bit;
}

function sternKopf(g, gi) {
  if (!hatSterne(g)) return '';
  const et = etappenVon(g);
  const n = et.filter(e => e.verdient).length;
  const titel = et.length === n ? 'Krone – alle Etappen geschafft' : `${n} von ${et.length} Sternen`;
  return `<span class="sterne ${n === et.length ? 'krone' : ''}" role="button" tabindex="0"
      title="${titel}" aria-label="${titel}" onclick="event.stopPropagation(); zeigeEtappen(${gi})">${n === et.length
        ? '👑'
        : et.map(e => `<i class="${e.verdient ? 'voll' : ''}">${e.verdient ? '★' : '☆'}</i>`).join('')}</span>`;
}

// Auf- und zuklappen ohne das Menü neu zu zeichnen – sonst sprängen
// die von Hand auf- oder zugeklappten Gruppen in den Startzustand zurück
const offeneEtappen = new Set();
function zeigeEtappen(gi) {
  const el = document.getElementById('etappen' + gi);
  if (!el) return;
  el.hidden = !el.hidden;
  if (el.hidden) offeneEtappen.delete(gi); else offeneEtappen.add(gi);
}

function etappenListe(g, gi) {
  if (!hatSterne(g)) return '';
  const f = g.sprache === 'en' ? '🇬🇧' : '🇫🇷';
  const et = etappenVon(g);
  const krone = et.every(e => e.verdient);
  return `
    <div class="etappen" id="etappen${gi}" ${offeneEtappen.has(gi) ? '' : 'hidden'}>
      ${et.map(e => {
        const rest = e.id === 'entdeckt'
          ? `noch ${e.fehlt.length === 1 ? '1 Liste' : e.fehlt.length + ' Listen'}: ${e.fehlt.join(', ')}`
          : `noch ${wortZahl(e.fehlt.length)}`;
        return `<div class="etappe ${e.verdient ? 'ok' : ''}">
          <span class="e-stern">${e.verdient ? '★' : '☆'}</span>
          <span><b>${e.name}</b> – ${e.was.replace('{f}', f)}${e.verdient ? '' : `<em>${rest}</em>`}</span>
        </div>`;
      }).join('')}
      <div class="etappe krone-zeile ${krone ? 'ok' : ''}">
        <span class="e-stern">👑</span>
        <span>${krone ? '<b>Krone verdient!</b>' : 'Alle Sterne = Krone'}</span>
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════════
//  RÄNGE – pro Sprache eine eigene Reihe, in der Zielsprache
// ════════════════════════════════════════════════════════════
const XP_STUFEN = [0, 50, 150, 300, 500, 750, 1000, 1400, 1800, 2500];
const NIVEAUS = {
  fr: ['Première année','Apprentie','Élève sorcière','Préfète','Enchanteresse',
       'Alchimiste','Métamorphe','Duelliste','Sorcière','Grande Magicienne'],
  en: ['First Year','Apprentice','Spell Student','Prefect','Enchantress',
       'Alchemist','Shapeshifter','Duellist','Sorceress','Archmage'],
};

function niveauVon(sprache) {
  const xp = daten.xp[sprache] || 0;
  let idx = 0;
  for (let i = 0; i < XP_STUFEN.length; i++) {
    if (xp >= XP_STUFEN[i]) idx = i; else break;
  }
  const max = idx === XP_STUFEN.length - 1;
  const lo = XP_STUFEN[idx];
  const hi = max ? lo + 500 : XP_STUFEN[idx + 1];
  return { idx, name: (NIVEAUS[sprache] || NIVEAUS.fr)[idx], xp, lo, hi, max };
}

function zeigeNiveau(sprache) {
  const n = niveauVon(sprache);
  document.getElementById('level-badge').textContent = `🪄 ${n.idx + 1}. Rang · ${n.name}`;
  document.getElementById('xp-bar-fill').style.width =
    Math.min(100, ((n.xp - n.lo) / (n.hi - n.lo)) * 100) + '%';
  document.getElementById('xp-label').textContent =
    n.max ? `⏳ ${n.xp} Punkte` : `⏳ ${n.xp - n.lo} / ${n.hi - n.lo}`;
}

function gibXP(sprache, serie) {
  const bonus = Math.min(20, Math.max(0, serie - 1) * 5);
  const gewonnen = 10 + bonus;
  const vorher = niveauVon(sprache).idx;
  daten.xp[sprache] = (daten.xp[sprache] || 0) + gewonnen;
  speichere();
  const nachher = niveauVon(sprache);
  zeigeNiveau(sprache);
  if (nachher.idx > vorher) zeigeLevelUp(nachher.name);
  return gewonnen;
}

function zeigeXPGewinn(xp, serie, el) {
  const p = document.createElement('div');
  p.className = 'xp-popup';
  p.textContent = serie >= 2 ? `+${xp} Punkte ✨` : `+${xp} Punkte`;
  document.body.appendChild(p);
  const r = el.getBoundingClientRect();
  p.style.left = (r.left + r.width / 2) + 'px';
  p.style.top = r.top + 'px';
  setTimeout(() => p.remove(), 1200);
}

function zeigeLevelUp(name) {
  const el = document.createElement('div');
  el.className = 'level-up-toast';
  el.innerHTML = `✦ Neuer Rang ✦<br>🪄 ${name}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2700);
}
