<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#150f0c">
<!-- Über „Zum Home-Bildschirm" startet das Quiz im Vollbild und behält seinen Speicher -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Üben">
<!-- Symbol für den Home-Bildschirm; iOS rundet die Ecken selbst -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Sprachen Üben ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<!-- ?v= gleich wie APP_VERSION in quiz.js: Nach einem Update lädt das Gerät
     so sicher die neuen Dateien statt einer alten aus dem Cache -->
<link rel="stylesheet" href="quiz.css?v=32">
<style>
  /* Goldverlauf der Sterne (#zGold, unten im <body>). Bleibt bewusst hier:
     In einer eigenen CSS-Datei suchen manche Browser url(#zGold) in der
     CSS-Datei statt in dieser Seite – dann wären die Sterne nicht golden. */
  .z-form polygon, .z-tinte { fill: url(#zGold); }
</style>
</head>
<body>

<canvas id="anim-canvas"></canvas>
<!-- Goldverlauf für alle Sterne des Stern-Zaubers -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="zGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/><stop offset="0.45" stop-color="#e9cf7a"/><stop offset="1" stop-color="#b8901c"/>
    </linearGradient>
  </defs>
</svg>

<div class="wrap">
  <header>
    <button class="back-btn" onclick="zumMenu()" aria-label="Zurück zum Menü">←</button>
    <h1 id="kopf">✦ Sprachen Üben ✦</h1>
    <div class="woche" id="woche"></div>
    <div id="konto-icon"></div>
    <div class="sprachwahl" id="sprachwahl"></div>
  </header>

  <!-- ══ STARTMENÜ ══ -->
  <div id="menu">
    <button class="heute" id="heute-btn" style="display:none"></button>
    <button class="resume" id="resume-btn" style="display:none"></button>
    <div id="gruppen"></div>
    <div class="hinweis" id="hinweis"></div>
    <div class="version" id="version"></div>
  </div>

  <!-- ══ QUIZ ══ -->
  <div id="quiz">
    <div class="player-bar">
      <span class="level-badge" id="level-badge">🪄 1. Rang</span>
      <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xp-bar-fill" style="width:0%"></div></div>
      <span class="xp-label" id="xp-label">0 / 50 XP</span>
    </div>

    <div class="mode-bar">
      <div class="modes" id="modi"></div>
      <label class="toggle-wrap" title="Automatisch vorlesen">
        <input type="checkbox" id="autoread-toggle" onchange="setzeVorlesen(this.checked)">
        <span class="toggle-slider"></span>
      </label>
      <span class="autoread-icon">🔊</span>
    </div>

    <div id="quiz-area"></div>
  </div>

  <!-- ══ KONTO (nur wenn in config.js eingerichtet) ══ -->
  <div id="konto"></div>
</div>

<script src="config.js"></script>
<script src="abgleich.js"></script>
<script src="konto.js"></script>
<script src="vokabeln.js"></script>
<script src="quiz.js?v=32"></script>
</body>
</html>
